var TOTAL = 196;
var autoCodes = {};
var batchNum = 0;

function fetchBatch(startIndex) {
  batchNum++;
  var cbName = 'cwBatch' + batchNum;
  var script = document.createElement('script');
  script.src = 'https://www.trippinforayear.com/feeds/posts/default?alt=json-in-script&callback=' + cbName + '&max-results=150&start-index=' + startIndex + '&_=' + Date.now();
  window[cbName] = function(data) {
    processBatch(data);
    window[cbName] = null;
  };
  document.head.appendChild(script);
}

function processBatch(data) {
  if (data && data.feed) {
    var total = parseInt(data.feed.openSearch$totalResults.$t, 10);
    var entries = data.feed.entry || [];
    entries.forEach(function(e) {
      if (e.category) {
        e.category.forEach(function(c) {
          var label = (c.term || '').trim().toLowerCase();
          if (CL[label]) autoCodes[CL[label].toLowerCase()] = true;
          if (CM[label]) autoCodes[CM[label].toLowerCase()] = true;
        });
      }
    });
    var curStart = parseInt(data.feed.openSearch$startIndex.$t, 10);
    var nextStart = curStart + entries.length;
    if (entries.length > 0 && nextStart <= total) {
      fetchBatch(nextStart);
    } else {
      allDone();
    }
  } else {
    allDone();
  }
}

function allDone() {
  var combined = {};
  Object.keys(autoCodes).forEach(function(c) { combined[c] = true; });
  MANUAL_COUNTRIES.forEach(function(code) {
    if (code) combined[code.toLowerCase().trim()] = true;
  });
  window.cwVisited = Object.keys(combined);
  renderSidebar(window.cwVisited);
}

fetchBatch(1);

function renderSidebar(visited) {
  var count = visited.length;
  var pct = (count / TOTAL * 100).toFixed(1);
  document.getElementById('cw-loading').style.display = 'none';
  document.getElementById('cw-content').style.display = 'block';
  document.getElementById('cw-count').textContent = count;
  document.getElementById('cw-pct').textContent = pct;
  document.getElementById('cw-fill').style.width = pct + '%';
}
})();
