* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; margin: 0; }
.content-wrap { display: flex; flex: 1; min-height: 0; }
#map { flex: 1; }
.sidebar { width: 280px; background: #1a1a2e; color: #eee; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; box-shadow: -2px 0 8px rgba(0,0,0,.3); z-index: 1000; }
.sidebar h2 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
.sidebar .sub { font-size: 12px; opacity: .6; margin-top: -14px; }
.filter-group { display: flex; flex-direction: column; gap: 6px; }
.filter-group label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .8px; opacity: .7; }
.filter-group select, .filter-group input { padding: 8px 10px; border: none; border-radius: 6px; font-size: 14px; background: #16213e; color: #eee; outline: 1px solid #0f3460; }
.filter-group select:focus, .filter-group input:focus { outline-color: #e94560; }
.filter-group input[type="range"] { width: 100%; accent-color: #e94560; padding: 0; }
.year-display { font-size: 24px; font-weight: 700; color: #e94560; text-align: center; }
.year-labels { display: flex; justify-content: space-between; font-size: 11px; opacity: .5; margin-top: -4px; }
.reset-btn { background: #e94560; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 4px; }
.reset-btn:hover { background: #c73650; }
.result-count { font-size: 13px; opacity: .6; text-align: center; }
.marker-popup { font-size: 13px; line-height: 1.5; }
.marker-popup h3 { margin: 0 0 4px; color: #e94560; font-size: 15px; }
.marker-popup p { margin: 2px 0; }
.marker-popup a { color: #3498db; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 4px; }
.marker-popup a:hover { text-decoration: underline; }
.category-tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eee; color: #333; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; opacity: .8; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); }
.sidebar-toggle { display: none; }
@media (max-width: 700px) {
  body { height: 100dvh; }
  .content-wrap { position: relative; }
  .sidebar-toggle { display: flex; align-items: center; justify-content: center; position: fixed; top: 10px; right: 10px; z-index: 1002; width: 40px; height: 40px; border: none; border-radius: 8px; background: #1a1a2e; color: #eee; font-size: 22px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .sidebar { position: absolute; top: 0; right: 0; height: 100%; z-index: 1001; transform: translateX(100%); transition: transform .2s ease; box-shadow: -4px 0 12px rgba(0,0,0,.4); }
  .sidebar.open { transform: translateX(0); }
  .sidebar h2, .sidebar .sub, .result-count, .legend { display: none; }
  .filter-group { flex: 1; min-width: 120px; }
}
</style>
</head>

<div class="content-wrap">

    <div class="year-labels"><span>2013</span><span>2025</span></div>

      <option value="Cats">Cats</option>
      <option value="Home">Home</option>
      <option value="Photos">Photos</option>
    </select>
  </div>

</div>

<script>
var map, markerLayer;

function initMap() {
  map = L.map('map', { zoomControl: true, worldCopyJump: true }).setView([25, 0], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);

  var countrySelect = document.getElementById('countryFilter');
  var countries = [...new Set(DATA.map(function(d) { return d.country; }))].sort();
  countries.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    countrySelect.appendChild(opt);
  });

  var yearSelect = document.getElementById('yearFilter');
  var years = [...new Set(DATA.map(function(d) { return d.year; }))].sort();
  years.forEach(function(y) {
    var opt = document.createElement('option');
    opt.value = y;
    opt.textContent = y;
    yearSelect.appendChild(opt);
  });

  renderMarkers();
}

function getFilters() {
  return {
    year: parseInt(document.getElementById('yearSlider').value, 10),
    exactYear: document.getElementById('yearFilter').value,
    country: document.getElementById('countryFilter').value,
    category: document.getElementById('categoryFilter').value
  };
}

function renderMarkers() {
  markerLayer.clearLayers();
  var filters = getFilters();
  var yearActive = filters.year < 2025 || filters.exactYear !== 'all';
  var colors = { Blog: '#e94560', Food: '#f39c12', Cats: '#9b59b6', Home: '#2ecc71', Photos: '#3498db' };
  var count = 0;

  DATA.forEach(function(item) {
    if (filters.exactYear !== 'all') {
      if (item.year !== parseInt(filters.exactYear, 10)) return;
    } else if (filters.year < 2025 && item.year > filters.year) return;
    if (filters.country !== 'all' && item.country !== filters.country) return;
    if (filters.category !== 'all' && item.category !== filters.category) return;
    count++;
    var color = yearActive ? (colors[item.category] || '#e94560') : '#888';
    var marker = L.circleMarker([item.lat, item.lng], {
      radius: 7,
      fillColor: color,
      color: '#fff',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.85
    });
    marker.bindPopup(
      '<div class="marker-popup"><h3>' + item.name + '</h3>' +
      '<p><strong>Country:</strong> ' + item.country + ' &middot; <strong>Year:</strong> ' + item.year + '</p>' +
      '<p><span class="category-tag">' + item.category + '</span></p>' +
      '<p>' + item.desc + '</p>' +
      '<a href="' + item.url + '" target="_blank">Read post &rarr;</a></div>'
    );
    markerLayer.addLayer(marker);
  });

  document.getElementById('resultCount').textContent = count + ' posts';
}

document.getElementById('yearSlider').addEventListener('input', function() {
  document.getElementById('yearDisplay').textContent = this.value;
  renderMarkers();
});

document.getElementById('yearFilter').addEventListener('change', renderMarkers);
document.getElementById('countryFilter').addEventListener('change', renderMarkers);
document.getElementById('categoryFilter').addEventListener('change', renderMarkers);

document.getElementById('resetBtn').addEventListener('click', function() {
  document.getElementById('yearSlider').value = 2025;
  document.getElementById('yearDisplay').textContent = '2025';
  document.getElementById('yearFilter').value = 'all';
  document.getElementById('countryFilter').value = 'all';
  document.getElementById('categoryFilter').value = 'all';
  renderMarkers();
});

document.getElementById('sidebarToggle').addEventListener('click', function() {
  document.querySelector('.sidebar').classList.toggle('open');
});

initMap();
</script>
