<!-- Countries Visited — paste into Blogger HTML widget -->
<style>
#cw-root { font-family: 'Montserrat', -apple-system, sans-serif; font-size: 12px; line-height: 1.6; }
#cw-root .cw-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(0,0,0,0.54); margin-bottom: 8px; }
#cw-root .cw-bar { height: 8px; background: #e8e8e8; border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
#cw-root .cw-fill { height: 100%; background: #bf8b38; border-radius: 4px; transition: width 0.8s ease; width: 0; }
#cw-root .cw-stats { font-size: 11px; color: rgba(0,0,0,0.54); margin-bottom: 8px; }
#cw-root .cw-stats strong { color: #333; font-weight: 700; }
#cw-root .cw-link { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
#cw-root .cw-link a { color: #bf8b38; text-decoration: none; cursor: pointer; }
#cw-root .cw-link a:hover { text-decoration: underline; }
#cw-root .cw-loading { font-size: 11px; color: rgba(0,0,0,0.54); padding: 4px 0; }
#cw-root .cw-loading::after { content: ''; display: inline-block; width: 10px; height: 10px; margin-left: 6px; border: 2px solid #e0e0e0; border-top-color: #bf8b38; border-radius: 50%; animation: cwspin 0.7s linear infinite; vertical-align: middle; }
@keyframes cwspin { to { transform: rotate(360deg); } }

/* Full-screen overlay */
.cw-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 99999; overflow: auto; }
.cw-overlay.cw-open { display: block; }
.cw-overlay .cw-close { position: fixed; top: 16px; right: 20px; color: #fff; font-size: 30px; cursor: pointer; background: none; border: none; z-index: 10; line-height: 1; opacity: 0.7; }
.cw-overlay .cw-close:hover { opacity: 1; }
.cw-overlay .cw-wrap { width: 92%; max-width: 1000px; margin: 30px auto 50px; }
.cw-overlay .cw-head { text-align: center; color: #fff; padding: 10px 0 16px; }
.cw-overlay .cw-head h2 { font-size: 22px; font-weight: 400; margin: 0 0 4px; font-family: 'EB Garamond', serif; text-transform: uppercase; letter-spacing: 1px; }
.cw-overlay .cw-head p { font-size: 13px; opacity: 0.6; margin: 0; font-family: 'Montserrat', sans-serif; }
.cw-overlay .cw-head .cw-pct { font-size: 28px; font-weight: 700; color: #bf8b38; }
.cw-overlay #cw-full-map { width: 100%; height: 500px; border-radius: 8px; overflow: hidden; background: #1a1a2e; }
.cw-overlay .cw-tags-full { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 16px; }
.cw-overlay .cw-tags-full .cw-tag { padding: 3px 10px; font-size: 12px; background: rgba(255,255,255,0.1); color: #ddd; border-radius: 4px; }
.cw-overlay .cw-tags-full .cw-tag:hover { background: #bf8b38; color: #fff; }
.cw-map-loading { display: flex; align-items: center; justify-content: center; height: 400px; color: #999; font-family: 'Montserrat', sans-serif; font-size: 14px; }
.cw-map-loading::after { content: ''; width: 20px; height: 20px; margin-left: 10px; border: 2px solid rgba(255,255,255,0.2); border-top-color: #bf8b38; border-radius: 50%; animation: cwspin 0.7s linear infinite; }
</style>

<div id="cw-root">
  <div class="cw-loading" id="cw-loading">Checking passports...</div>
  <div id="cw-content" style="display:none">
    <div class="cw-label">Countries Visited</div>
    <div class="cw-bar"><div class="cw-fill" id="cw-fill"></div></div>
    <div class="cw-stats"><strong id="cw-count">0</strong> / 195 UN countries (<strong id="cw-pct">0</strong>%)</div>
    <div class="cw-link"><a id="cw-view-link" onclick="cwOpenFull()">View on World Map &raquo;</a></div>
  </div>
</div>

<div class="cw-overlay" id="cw-overlay">
  <button class="cw-close" onclick="cwCloseFull()">&times;</button>
  <div class="cw-wrap">
    <div class="cw-head">
      <h2>Countries Visited</h2>
      <p><span class="cw-pct" id="cw-full-pct">0</span>% of the world &middot; <span id="cw-full-count">0</span> / 195 UN countries</p>
      <p style="font-size:11px;margin-top:4px"><span id="cw-manual-hint" style="opacity:0.4">Click a country on the map to manually toggle visited</span></p>
    </div>
    <div class="cw-map-loading" id="cw-map-loading">Loading map...</div>
    <div id="cw-full-map"></div>
    <div class="cw-tags-full" id="cw-tags-full"></div>
  </div>
</div>

<script>
(function() {
  var CL = {
    "argentina":"AR","austria":"AT","belgium":"BE","brazil":"BR",
    "chile":"CL","china":"CN","cuba":"CU","czech republic":"CZ","czechia":"CZ",
    "denmark":"DK","estonia":"EE","finland":"FI","france":"FR",
    "germany":"DE","greece":"GR","hungary":"HU","india":"IN","italy":"IT",
    "japan":"JP","laos":"LA","latvia":"LV","lithuania":"LT",
    "malaysia":"MY","mexico":"MX","morocco":"MA","myanmar":"MM",
    "nepal":"NP","netherlands":"NL","norway":"NO","panama":"PA",
    "peru":"PE","poland":"PL","slovakia":"SK","south africa":"ZA",
    "spain":"ES","sweden":"SE","switzerland":"CH","thailand":"TH",
    "turkey":"TR","united arab emirates":"AE","uae":"AE",
    "uruguay":"UY","usa":"US","united states":"US"
  };
  var CM = {
    "bangkok":"TH","chiang mai":"TH","chiang rai":"TH","koh tao":"TH","koh samui":"TH",
    "mumbai":"IN","delhi":"IN","kolkata":"IN","varanasi":"IN","jaipur":"IN","agra":"IN","goa":"IN",
    "pokhara":"NP","kathmandu":"NP",
    "yangon":"MM","mandalay":"MM","bagan":"MM",
    "tokyo":"JP","osaka":"JP","kyoto":"JP","hiroshima":"JP",
    "istanbul":"TR","bodrum":"TR",
    "athens":"GR","santorini":"GR","kos":"GR",
    "barcelona":"ES","madrid":"ES","granada":"ES",
    "paris":"FR","versailles":"FR",
    "rome":"IT","milan":"IT","venice":"IT","pompeii":"IT",
    "brussels":"BE","bruges":"BE",
    "amsterdam":"NL","berlin":"DE","bremen":"DE",
    "prague":"CZ","bratislava":"SK","vienna":"AT","budapest":"HU","zurich":"CH",
    "stockholm":"SE","gothenburg":"SE","copenhagen":"DK",
    "oslo":"NO","stavanger":"NO","helsinki":"FI","turku":"FI",
    "tallinn":"EE","riga":"LV","vilnius":"LT","warsaw":"PL","krakow":"PL",
    "cape town":"ZA",
    "sao paulo":"BR","bombinhas":"BR","florianopolis":"BR",
    "buenos aires":"AR","mendoza":"AR",
    "lima":"PE","cusco":"PE","arequipa":"PE","machu picchu":"PE",
    "panama city":"PA","cancun":"MX","havana":"CU","varadero":"CU","trinidad":"CU",
    "san francisco":"US","dubai":"AE",
    "urumqi":"CN","kashgar":"CN","shanghai":"CN",
    "kuala lumpur":"MY",
    "casablanca":"MA","marrakesh":"MA","fes":"MA","tangier":"MA","chefchaouen":"MA"
  };
  var NM = {
    "ar":"Argentina","at":"Austria","be":"Belgium","br":"Brazil",
    "cl":"Chile","cn":"China","cu":"Cuba","cz":"Czech Republic",
    "dk":"Denmark","ee":"Estonia","fi":"Finland","fr":"France",
    "de":"Germany","gr":"Greece","hu":"Hungary","in":"India",
    "it":"Italy","jp":"Japan","la":"Laos","lv":"Latvia",
    "lt":"Lithuania","my":"Malaysia","mx":"Mexico","ma":"Morocco",
    "mm":"Myanmar","np":"Nepal","nl":"Netherlands","no":"Norway",
    "pa":"Panama","pe":"Peru","pl":"Poland","sk":"Slovakia",
    "za":"South Africa","es":"Spain","se":"Sweden","ch":"Switzerland",
    "th":"Thailand","tr":"Turkey","ae":"United Arab Emirates",
    "uy":"Uruguay","us":"United States"
  };
  // === MANUAL OVERRIDE ===
  // Add 2-letter ISO codes for countries not detected from blog labels.
  // Example: "va" for Vatican City, "gb" for United Kingdom, "au" for Australia.
  var MANUAL_COUNTRIES = [];

  var TOTAL = 195;
  var autoCodes = {};
  var batchNum = 0;

  function fetchBatch(startIndex) {
    batchNum++;
    var cbName = 'cwBatch' + batchNum;
    var script = document.createElement('script');
    script.src = 'https://www.trippinforayear.com/feeds/posts/default?alt=json-in-script&callback=' + cbName + '&max-results=150&start-index=' + startIndex + '&_=' + Date.now();
    window[cbName] = function(data) {
      processBatch(data);
      window[cbName] = null;
    };
    document.head.appendChild(script);
  }

  function processBatch(data) {
    if (data && data.feed) {
      var total = parseInt(data.feed.openSearch$totalResults.$t, 10);
      var entries = data.feed.entry || [];
      entries.forEach(function(e) {
        if (e.category) {
          e.category.forEach(function(c) {
            var label = (c.term || '').trim().toLowerCase();
            if (CL[label]) autoCodes[CL[label].toLowerCase()] = true;
            if (CM[label]) autoCodes[CM[label].toLowerCase()] = true;
          });
        }
      });
      var curStart = parseInt(data.feed.openSearch$startIndex.$t, 10);
      var nextStart = curStart + entries.length;
      if (entries.length > 0 && nextStart <= total) {
        fetchBatch(nextStart);
      } else {
        allDone();
      }
    } else {
      allDone();
    }
  }

  function allDone() {
    var combined = {};
    Object.keys(autoCodes).forEach(function(c) { combined[c] = true; });
    MANUAL_COUNTRIES.forEach(function(code) {
      if (code) combined[code.toLowerCase().trim()] = true;
    });
    var saved = [];
    try { saved = JSON.parse(localStorage.getItem('cwManual') || '[]'); } catch(e) {}
    saved.forEach(function(code) {
      if (code) combined[code.toLowerCase().trim()] = true;
    });
    window.cwVisited = Object.keys(combined);
    renderSidebar(window.cwVisited);
  }

  fetchBatch(1);

  function renderSidebar(visited) {
    var count = visited.length;
    var pct = (count / TOTAL * 100).toFixed(1);
    document.getElementById('cw-loading').style.display = 'none';
    document.getElementById('cw-content').style.display = 'block';
    document.getElementById('cw-count').textContent = count;
    document.getElementById('cw-pct').textContent = pct;
    document.getElementById('cw-fill').style.width = pct + '%';
  }

  window.cwOpenFull = function() {
    document.getElementById('cw-overlay').classList.add('cw-open');
    document.body.style.overflow = 'hidden';
    if (window.cwVisited) renderFull(window.cwVisited);
  };

  window.cwCloseFull = function() {
    document.getElementById('cw-overlay').classList.remove('cw-open');
    document.body.style.overflow = '';
  };

  function renderFull(visited) {
    var count = visited.length;
    var pct = (count / TOTAL * 100).toFixed(1);
    document.getElementById('cw-full-count').textContent = count;
    document.getElementById('cw-full-pct').textContent = pct;

    var tagsEl = document.getElementById('cw-tags-full');
    tagsEl.innerHTML = '';
    visited.map(function(c) { return NM[c] || c.toUpperCase(); }).sort().forEach(function(name) {
      var span = document.createElement('span');
      span.className = 'cw-tag';
      span.textContent = name;
      tagsEl.appendChild(span);
    });

    loadMapLibs(function() {
      var regionData = {};
      visited.forEach(function(code) { regionData[code] = '#bf8b38'; });
      document.getElementById('cw-map-loading').style.display = 'none';

      var map = jQuery('#cw-full-map').vectorMap({
        map: 'world_mill',
        backgroundColor: '#1a1a2e',
        zoomOnScroll: true,
        zoomButtons: true,
        regionStyle: {
          initial: { fill: '#3a3a5c', 'fill-opacity': 1, stroke: '#2a2a4a', 'stroke-width': 0.5 },
          hover: { 'fill-opacity': 0.7, cursor: 'pointer' }
        },
        series: { regions: [{ values: regionData, attribute: 'fill' }] },
        onRegionTipShow: function(e, el, code) {
          var name = NM[code] || code.toUpperCase();
          el.html(name + ' &mdash; ' + (regionData[code] ? '<span style="color:#bf8b38">Visited</span>' : 'Not yet'));
        },
        onRegionClick: function(e, code) {
          e.preventDefault();
          toggleCountry(code.toLowerCase());
        }
      });
    });
  }

  function toggleCountry(code) {
    if (!NM[code]) return;
    var saved = [];
    try { saved = JSON.parse(localStorage.getItem('cwManual') || '[]'); } catch(e) {}
    var idx = saved.indexOf(code);
    if (idx >= 0) { saved.splice(idx, 1); } else { saved.push(code); }
    localStorage.setItem('cwManual', JSON.stringify(saved));

    var combined = {};
    Object.keys(autoCodes).forEach(function(c) { combined[c] = true; });
    MANUAL_COUNTRIES.forEach(function(c) { if (c) combined[c.toLowerCase().trim()] = true; });
    saved.forEach(function(c) { if (c) combined[c.toLowerCase().trim()] = true; });

    window.cwVisited = Object.keys(combined);
    renderSidebar(window.cwVisited);
    renderFull(window.cwVisited);
  }

  function loadMapLibs(callback) {
    var loaded = 0;
    var total = 3;
    function check() { loaded++; if (loaded >= total) callback(); }
    if (typeof jQuery !== 'undefined' && typeof jQuery.fn.vectorMap !== 'undefined') { check(); check(); check(); return; }
    var jq = document.createElement('script');
    jq.src = 'https://code.jquery.com/jquery-3.6.0.min.js';
    jq.onload = check;
    document.head.appendChild(jq);
    var jvm = document.createElement('script');
    jvm.src = 'https://cdnjs.cloudflare.com/ajax/libs/jvectormap/2.0.5/jquery-jvectormap.min.js';
    jvm.onload = check;
    document.head.appendChild(jvm);
    var mapData = document.createElement('script');
    mapData.src = 'https://cdnjs.cloudflare.com/ajax/libs/jvectormap/2.0.5/jquery-jvectormap-world-mill.js';
    mapData.onload = check;
    document.head.appendChild(mapData);
  }
})();
</script>
<!-- End Countries Visited widget -->
